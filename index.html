<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <meta name="description" content="写给 WZP 与 LH 的粒子心动程序。">
  <title>WZP × LH · Love Runtime</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="has-started">
  <div class="noise" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="aurora aurora-one" aria-hidden="true"></div>
  <div class="aurora aurora-two" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="重新运行爱心">
      <span class="brand-mark">W<span class="brand-heart">♥</span>L</span>
      <span class="brand-copy">
        <strong>love_runtime</strong>
        <small>WZP &amp; LH · forever build</small>
      </span>
    </a>

    <div class="topbar-status" aria-label="程序运行状态">
      <span class="status-dot"></span>
      <span>RUNNING</span>
      <span class="status-separator">/</span>
      <span id="fps-counter">60 FPS</span>
    </div>

    <nav class="controls" aria-label="页面控制">
      <button id="sound-toggle" class="icon-button is-muted" type="button" aria-pressed="false" aria-label="开启音乐">
        <span class="sound-wave" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button id="replay-top" class="icon-button" type="button" aria-label="重新运行爱心">
        <span class="replay-icon" aria-hidden="true">↻</span>
      </button>
      <button id="fullscreen-toggle" class="icon-button" type="button" aria-label="进入全屏">
        <span class="fullscreen-icon" aria-hidden="true"></span>
      </button>
    </nav>
  </header>

  <main>
    <section id="experience" class="experience" aria-label="WZP 与 LH 的粒子爱心">
      <div class="name-lockup" aria-label="WZP 和 LH">
        <span>WZP</span>
        <i aria-hidden="true">♥</i>
        <span>LH</span>
      </div>

      <div id="message-card" class="message-card">
        <p class="message-line">WZP，遇见你之后，<br>连代码都开始偏心。</p>
        <p class="message-signature">你的 LH <span aria-hidden="true">♡</span></p>
        <div class="message-actions">
          <button id="replay-button" type="button">再看一遍</button>
          <button id="star-button" type="button">点亮一颗星</button>
        </div>
      </div>

      <p class="interaction-hint">移动鼠标，拨动星光 · 点击任意处，让心动发生</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <p id="live-status" class="sr-only" aria-live="polite">粒子爱心正在形成。</p>

  <noscript>
    <div class="noscript">请启用 JavaScript，才能运行这封心动。</div>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
